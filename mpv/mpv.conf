# Global
profile=fast

[svp]
profile-desc="SVP Pro configuration"
# SVP-specific parameters
hwdec=auto-copy
hwdec-codecs=all
input-ipc-server=/tmp/mpvsocket
hr-seek-framedrop=no
no-resume-playback
# Pitch-shift to match display refresh rate precisely.
video-sync=display-resample
# Revert 'fast' macro parameters to standard/high-quality defaults
# scale=ewa_lanczossharp
# dscale=mitchell
# dither-depth=auto
# correct-downscaling=yes
# linear-downscaling=yes
# sigmoid-upscaling=yes

[hdr]
profile-desc="HDR experimental config, not recently tested"
profile-cond=p["video-params/gamma"] == "pq"
profile-restore=copy
tone-mapping=spline
gamut-mapping-mode=auto
hdr-compute-peak=yes
